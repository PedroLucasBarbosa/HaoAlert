name: Android Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Resolve app version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(grep -E '^appVersion=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "App version: ${VERSION}"

      # Assinatura opcional: se os secrets existirem no repositório, o APK sai assinado com a sua
      # chave. Sem eles, o Gradle assina com a chave de debug, e o APK continua instalável.
      - name: Prepare signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.HAO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/hao-release.jks"
            echo "HAO_KEYSTORE_PATH=${RUNNER_TEMP}/hao-release.jks" >> "$GITHUB_ENV"
          else
            echo "No signing secrets configured; using the debug signing key."
          fi

      - name: Build release APK
        env:
          HAO_KEYSTORE_PASSWORD: ${{ secrets.HAO_KEYSTORE_PASSWORD }}
          HAO_KEY_ALIAS: ${{ secrets.HAO_KEY_ALIAS }}
          HAO_KEY_PASSWORD: ${{ secrets.HAO_KEY_PASSWORD }}
        run: >
          gradle --no-daemon assembleRelease
          -PappVersion=${{ steps.version.outputs.version }}
          -PappVersionCode=${{ github.run_number }}

      - name: Name the APK
        run: |
          mkdir -p dist
          APK="$(ls app/build/outputs/apk/release/*.apk | head -n 1)"
          cp "${APK}" "dist/HaoAlert-v${{ steps.version.outputs.version }}.apk"
          ls -la dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HaoAlert-v${{ steps.version.outputs.version }}
          path: dist/HaoAlert-v${{ steps.version.outputs.version }}.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/HaoAlert-v${{ steps.version.outputs.version }}.apk
          generate_release_notes: true
